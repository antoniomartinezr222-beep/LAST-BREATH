{% extends "base.html" %}
{% block title %}Registrarse - Last Breath{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: radial-gradient(ellipse 60% 60% at 50% 0%, rgba(0,212,212,0.08), transparent);
    }

    .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 480px;
    }

    .auth-header { text-align: center; margin-bottom: 2rem; }

    .auth-logo {
        width: 56px;
        height: 56px;
        background: var(--cyan);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin: 0 auto 1rem;
    }

    .auth-header h1 {
        font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-size: 2rem;
        letter-spacing: 2px;
    }

    .auth-header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .auth-form { display: flex; flex-direction: column; gap: 1.2rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.88rem;
        color: var(--muted);
    }

    .auth-footer a { color: var(--cyan); text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">✨</div>
            <h1>CREAR CUENTA</h1>
            <p>Únete a Last Breath y solicita servicios hoy</p>
        </div>

        <form class="auth-form" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-row">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Juan López" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" name="telefono" class="form-control" placeholder="+57 300..." required>
                </div>
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label>Dirección Principal</label>
                <input type="text" name="direccion" class="form-control" placeholder="Calle 1 #2-3, Cartagena" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;font-size:1rem;justify-content:center;">
                Crear Cuenta
            </button>
        </form>

        <div class="auth-footer">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
        </div>
    </div>
</div>
{% endblock %}
