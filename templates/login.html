{% extends "base.html" %}
{% block title %}Iniciar Sesión - Last Breath{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: radial-gradient(ellipse 60% 60% at 50% 0%, rgba(0,212,212,0.08), transparent);
    }

    .auth-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
    }

    .auth-header { text-align: center; margin-bottom: 2rem; }

    .auth-logo {
        width: 56px;
        height: 56px;
        background: var(--cyan);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin: 0 auto 1rem;
    }

    .auth-header h1 {
        font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-size: 2rem;
        letter-spacing: 2px;
    }

    .auth-header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .auth-form { display: flex; flex-direction: column; gap: 1.2rem; }

    .auth-submit {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        margin-top: 0.5rem;
        justify-content: center;
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.88rem;
        color: var(--muted);
    }

    .auth-footer a { color: var(--cyan); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }

    .divider {
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
        margin: 0.5rem 0;
        position: relative;
    }

    .divider::before, .divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background: var(--border);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🔧</div>
            <h1>INICIAR SESIÓN</h1>
            <p>Panel de Cliente - Last Breath</p>
        </div>

        <form class="auth-form" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="email" class="form-control" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit">Iniciar Sesión</button>
        </form>

        <div class="auth-footer">
            ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
        </div>

        <div style="margin-top: 1rem; text-align: center;">
            <a href="/admin/login" style="color: var(--muted); font-size: 0.8rem; text-decoration: none;">
                → Acceso Administrador
            </a>
        </div>
    </div>
</div>
{% endblock %}
